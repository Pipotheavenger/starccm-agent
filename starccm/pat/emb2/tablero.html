<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOE en vivo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1d2330; --mut:#6b7280; --ok:#16a34a; --run:#2563eb; --warn:#d97706; --bad:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --tx:#e5e7eb; --mut:#9ca3af; --line:#2a2f3a; } }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--tx); }
  header { padding:12px 16px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  .mut { color:var(--mut); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:15px; margin:0 0 4px; display:flex; justify-content:space-between; gap:8px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; color:#fff; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--run); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px; }
  td, th { padding:3px 6px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .log { font:12px ui-monospace, monospace; white-space:pre-wrap; max-height:110px; overflow:auto; color:var(--mut); margin-top:8px; }
  .workers { padding:0 16px 16px; }
  svg { width:100%; height:150px; }
</style>
</head>
<body>
<header>
  <h1>DOE en vivo</h1>
  <span id="doe" class="mut"></span>
  <span id="hora" class="mut"></span>
</header>
<main id="cards"></main>
<div class="workers"><table id="workers"></table></div>
<script>
const C = { terminado:'var(--ok)', corriendo:'var(--run)', esperando:'var(--mut)', error:'var(--bad)', sin_progreso:'var(--warn)' };
const f = (v, d=1) => v == null || v === '' || isNaN(+v) ? '–' : (+v).toFixed(d);
// curva(pts, clave CFD, clave CFturbo, título, color): CFD en línea llena con puntos, CFturbo punteada
function curva(pts, k, kc, titulo, col) {
  const ok = pts.filter(p => p[k] != null && p.Q != null);
  const ref = pts.filter(p => p[kc] != null);
  if (!ok.length && !ref.length) return '';
  const qs = pts.map(p => p.Q), ys = ok.map(p => p[k]).concat(ref.map(p => p[kc]));
  const x1 = Math.max(...qs) * 1.05, y1 = Math.max(...ys) * 1.1 || 1;
  const X = q => 34 + 356 * q / x1, Y = v => 130 - 115 * Math.max(0, v) / y1;
  const cft = ref.map(p => `${X(p.Q)},${Y(p[kc])}`).join(' ');
  const cfd = ok.slice().sort((a, b) => a.Q - b.Q).map(p => `${X(p.Q)},${Y(p[k])}`).join(' ');
  return `<svg viewBox="0 0 400 150"><line x1="34" y1="130" x2="395" y2="130" stroke="var(--line)"/>
    <text x="30" y="${Y(y1 / 1.1) + 3}" font-size="9" fill="var(--mut)" text-anchor="end">${(y1 / 1.1).toPrecision(3)}</text>
    <polyline points="${cft}" fill="none" stroke="var(--mut)" stroke-dasharray="4 3"/>
    <polyline points="${cfd}" fill="none" stroke="${col}" stroke-width="2"/>
    ${ok.map(p => `<circle cx="${X(p.Q)}" cy="${Y(p[k])}" r="3" fill="${col}"/>`).join('')}
    <text x="36" y="12" font-size="10" fill="var(--mut)">${titulo} · CFD — · CFturbo - -</text>
    <text x="395" y="146" font-size="10" fill="var(--mut)" text-anchor="end">Q (m³/h)</text></svg>`;
}
async function cargar() {
  let e; try { e = await (await fetch('estado.json?' + Date.now())).json(); } catch { setTimeout(cargar, 2000); return; }
  document.getElementById('doe').textContent = e.doe;
  document.getElementById('hora').textContent = 'actualizado ' + e.hora;
  document.getElementById('cards').innerHTML = e.geometrias.map(g => {
    const hechos = g.puntos.filter(p => p.estado === 'terminado').length;
    return `<div class="card">
      <h2><span>${g.id}</span><span class="pill" style="background:${C[g.estado] || 'var(--mut)'}">${g.estado.replace('_', ' ')}</span></h2>
      <div class="mut">${g.worker} · ${hechos}/${g.puntos.length} puntos · ${g.actual || ''}</div>
      <div class="bar"><div style="width:${100 * g.avance}%"></div></div>
      <div class="mut">${g.s_it ? f(g.s_it, 2) + ' s/iteración · ' : ''}${g.min_punto ? '~' + f(g.min_punto, 0) + ' min/punto · ' : ''}${g.faltan_min ? 'faltan ~' + (g.faltan_min / 60).toFixed(1) + ' h' : ''}</div>
      <table><tr><th>#</th><th>Q m³/h</th><th>iter.</th><th>min</th><th>H m</th><th>η</th><th>M N·m</th><th>estado</th></tr>
      ${g.puntos.map(p => `<tr><td>${p.n}</td><td>${f(p.Q)}</td><td>${p.it ?? '–'}${p.meta ? '/' + p.meta : ''}</td><td>${f(p.min, 0)}</td><td>${f(p.H, 2)}</td><td>${f(p.eta, 3)}</td><td>${f(p.M, 2)}</td>
        <td style="color:${C[p.estado] || 'var(--mut)'}">${p.estado}</td></tr>`).join('')}</table>
      ${curva(g.puntos, 'H', 'Hcft', 'H (m)', 'var(--run)')}
      ${curva(g.puntos, 'eta', 'etacft', 'η', 'var(--ok)')}
      <div class="log">${(g.log || []).slice(-6).join('\n')}</div></div>`;
  }).join('') || '<p class="mut">Sin geometrías en marcha.</p>';
  document.getElementById('workers').innerHTML = '<tr><th>worker</th><th>host</th><th>procesos</th><th>CPU %</th><th>C: libre GB</th><th>leído</th></tr>' +
    e.workers.map(w => `<tr><td>${w.ip}</td><td>${w.host || '–'}</td><td>${w.procesos_star ?? '–'}</td><td>${w.cpu_pct ?? '–'}</td><td>${w.c_libre_gb ?? '–'}</td><td>${w.error ? '⚠ ' + w.error : w.hora}</td></tr>`).join('');
}
cargar(); setInterval(cargar, 15000);
</script>
</body>
</html>
